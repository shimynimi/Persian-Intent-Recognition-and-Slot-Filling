[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persian-intent-baseline"
version = "0.1.0"
description = "Persian intent-classification experiments on MASSIVE"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.17,<4.0",
  "joblib>=1.3,<2.0",
  "scikit-learn>=1.3,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9.0"]
bert = [
  "torch>=2.2,<3",
  "transformers>=4.45,<5",
  "tokenizers>=0.20,<1",
  "pandas>=2.1,<3",
  "pyarrow>=15,<25",
  "safetensors>=0.4,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
